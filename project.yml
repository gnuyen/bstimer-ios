# Generate the Xcode project with: xcodegen generate
name: CstimerBT
options:
  bundleIdPrefix: org.gnuyen
  deploymentTarget:
    iOS: "17.0"
targets:
  CstimerBT:
    type: application
    platform: iOS
    sources:
      - path: CstimerApp
        excludes:
          - "Resources/**"
      - path: CstimerApp/Resources
        buildPhase: resources
    entitlements:
      path: CstimerApp/bsTimer.entitlements
      properties:
        # iCloud sync (bsTimer mode): the data in CloudKit, the server sync code in key-value storage.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.gnuyen.bstimer
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Sign in with Apple (so the App ID gets the capability; the sign-in itself comes later)
        com.apple.developer.applesignin:
          - Default
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gnuyen.bstimer
        PRODUCT_NAME: bsTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The build number; the app's revision badge (r23 …) shows the same number.
        CURRENT_PROJECT_VERSION: "25"
    info:
      path: CstimerApp/Info.plist
      properties:
        CFBundleDisplayName: bsTimer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS/TLS from the system, so no export compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: bsTimer uses Bluetooth to connect to smart cubes and timers.
        UILaunchScreen: {}
        # Service workers (offline support) only run in WKWebView on app-bound domains.
        # The WCA hosts are listed so in-app sign-in keeps working if navigation is limited to these.
        WKAppBoundDomains:
          - cstimer.gnuyen.org
          - cstimer.net
          - www.cstimer.net
          - www.worldcubeassociation.org
          - worldcubeassociation.org
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
